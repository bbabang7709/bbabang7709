name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: bbapang7709
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=7EE7E0&color_dots=#161B22,#203B3B,#2B6865,#45AAA3,#7EE7E0
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=7EE7E0&color_dots=#161B22,#203B3B,#2B6865,#45AAA3,#7EE7E0

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: output
          publish_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
