<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="청온 CheongOn — Game Client Developer">
  <title>청온 CheongOn — Game Client Developer</title>
  <style>
    .title { font: 800 64px "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #3D4B3F; letter-spacing: -1px; }
    .sub   { font: 600 13px ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #7C8C7F; letter-spacing: 3px; }
    .hud   { font: 700 12px ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #7C8C7F; letter-spacing: 2px; }

    /* 장애물 두 개가 2초 간격으로 지나가고(각 4초 주기), 플레이어는 2초마다 그 타이밍에 점프 */
    .runner { animation: jump 2s linear infinite; }
    @keyframes jump {
      0%, 54%  { transform: translateY(0); }
      58%      { transform: translateY(-50px); }
      64%      { transform: translateY(-60px); }
      70%      { transform: translateY(-50px); }
      74%      { transform: translateY(0); }
      75.5%    { transform: translateY(0) scaleY(.88); }
      77%, 100%{ transform: translateY(0); }
    }
    .runner, .shadow { transform-box: fill-box; transform-origin: 50% 100%; }
    .shadow { animation: shadow 2s linear infinite; transform-origin: center; }
    @keyframes shadow {
      0%, 54%, 74%, 100% { transform: scaleX(1); opacity: .35; }
      64% { transform: scaleX(.45); opacity: .15; }
    }

    .obstacle { animation: scroll 4s linear infinite; }
    .obstacle.b { animation-delay: -2s; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1020px); } }

    .coin { animation: collect 4s steps(1) infinite; }
    .obstacle.b .coin { animation-delay: -2s; }
    @keyframes collect { 0%, 81% { opacity: 1; } 82%, 100% { opacity: 0; } }

    .dashes { animation: dash .4s linear infinite; }
    @keyframes dash { to { transform: translateX(-102px); } }

    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 55% { opacity: 0; } }
  </style>

  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="960" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="260" fill="#F6F9F3"/>

    <!-- HUD -->
    <text class="hud" x="896" y="46" text-anchor="end">WORLD 1-1</text>
    <circle cx="854" cy="66" r="5" fill="#FFE08A" stroke="#E0B84A" stroke-width="1.5"/>
    <text class="hud" x="896" y="70" text-anchor="end">× 03</text>

    <!-- 타이틀 -->
    <text class="title" x="64" y="112">청온</text>
    <text class="sub" x="68" y="142" textLength="336" lengthAdjust="spacing">CHEONGON · GAME CLIENT DEVELOPER</text>
    <rect class="blink" x="414" y="131" width="8" height="13" fill="#A8E6A3"/>

    <!-- 바닥 -->
    <rect x="0" y="214" width="960" height="2" fill="#3D4B3F"/>
    <g class="dashes" fill="#C9D3CB">
      <rect x="10" y="226" width="18" height="2"/><rect x="62" y="234" width="8" height="2"/>
      <rect x="112" y="226" width="18" height="2"/><rect x="164" y="234" width="8" height="2"/>
      <rect x="214" y="226" width="18" height="2"/><rect x="266" y="234" width="8" height="2"/>
      <rect x="316" y="226" width="18" height="2"/><rect x="368" y="234" width="8" height="2"/>
      <rect x="418" y="226" width="18" height="2"/><rect x="470" y="234" width="8" height="2"/>
      <rect x="520" y="226" width="18" height="2"/><rect x="572" y="234" width="8" height="2"/>
      <rect x="622" y="226" width="18" height="2"/><rect x="674" y="234" width="8" height="2"/>
      <rect x="724" y="226" width="18" height="2"/><rect x="776" y="234" width="8" height="2"/>
      <rect x="826" y="226" width="18" height="2"/><rect x="878" y="234" width="8" height="2"/>
      <rect x="928" y="226" width="18" height="2"/><rect x="980" y="234" width="8" height="2"/>
      <rect x="1030" y="226" width="18" height="2"/><rect x="1082" y="234" width="8" height="2"/>
    </g>

    <!-- 장애물 + 코인 (오른쪽 밖에서 출발) -->
    <g class="obstacle a">
      <rect x="980" y="192" width="20" height="22" rx="3" fill="#A8E6A3" stroke="#74C27A" stroke-width="2"/>
      <circle class="coin" cx="990" cy="160" r="6" fill="#FFE08A" stroke="#E0B84A" stroke-width="1.5"/>
    </g>
    <g class="obstacle b">
      <rect x="980" y="198" width="28" height="16" rx="3" fill="#A8E6A3" stroke="#74C27A" stroke-width="2"/>
      <circle class="coin" cx="994" cy="160" r="6" fill="#FFE08A" stroke="#E0B84A" stroke-width="1.5"/>
    </g>

    <!-- 플레이어 -->
    <ellipse class="shadow" cx="151" cy="216" rx="13" ry="3" fill="#3D4B3F"/>
    <g class="runner">
      <rect x="140" y="190" width="24" height="24" rx="6" fill="#FF9AA2" stroke="#F2667A" stroke-width="2"/>
      <rect x="154" y="197" width="4" height="7" rx="1" fill="#3D4B3F"/>
      <rect x="144" y="206" width="5" height="3" rx="1.5" fill="#FFFFFF" opacity=".7"/>
    </g>
  </g>
</svg>
