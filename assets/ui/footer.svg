<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-label="THANKS FOR PLAYING! CONTINUE? YES / NO">
  <title>THANKS FOR PLAYING! CONTINUE? YES / NO</title>
  <style>
    .t { font: 700 17px ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #EEF3EC; letter-spacing: 4px; }
    .c { font: 700 14px ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #8FA394; letter-spacing: 3px; }
    .y { fill: #F2667A; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 55% { opacity: 0; } }
    .idle { transform-box: fill-box; transform-origin: 50% 100%; animation: idle 1.6s ease-in-out infinite; }
    @keyframes idle { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.92); } }
    .wave { transform-box: fill-box; transform-origin: 0 50%; animation: wave 1.2s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: scaleX(1); } to { transform: scaleX(.8); } }
  </style>
  <defs><clipPath id="f"><rect width="960" height="160" rx="18"/></clipPath></defs>
  <g clip-path="url(#f)">
    <rect width="960" height="160" fill="#1C221E"/>

    <text class="t" x="480" y="52" text-anchor="middle">THANKS FOR PLAYING!</text>
    <text class="c" x="380" y="84" textLength="100" lengthAdjust="spacing">CONTINUE?</text>
    <path class="blink" d="M492 73 l8 5 -8 5 z" fill="#F2667A"/>
    <text class="c y" x="506" y="84" textLength="31" lengthAdjust="spacing">YES</text>
    <text class="c" x="561" y="84" textLength="20" lengthAdjust="spacing">NO</text>

    <rect x="0" y="120" width="960" height="2" fill="#5C6B5F"/>
    <g fill="#3A453C"><rect x="10" y="132" width="18" height="2"/><rect x="62" y="140" width="8" height="2"/><rect x="112" y="132" width="18" height="2"/><rect x="164" y="140" width="8" height="2"/><rect x="214" y="132" width="18" height="2"/><rect x="266" y="140" width="8" height="2"/><rect x="316" y="132" width="18" height="2"/><rect x="368" y="140" width="8" height="2"/><rect x="418" y="132" width="18" height="2"/><rect x="470" y="140" width="8" height="2"/><rect x="520" y="132" width="18" height="2"/><rect x="572" y="140" width="8" height="2"/><rect x="622" y="132" width="18" height="2"/><rect x="674" y="140" width="8" height="2"/><rect x="724" y="132" width="18" height="2"/><rect x="776" y="140" width="8" height="2"/><rect x="826" y="132" width="18" height="2"/><rect x="878" y="140" width="8" height="2"/><rect x="928" y="132" width="18" height="2"/><rect x="980" y="140" width="8" height="2"/><rect x="1030" y="132" width="18" height="2"/><rect x="1082" y="140" width="8" height="2"/></g>

    <!-- 플레이어: 스테이지를 끝내고 숨 고르는 중 -->
    <ellipse cx="151" cy="122" rx="13" ry="3" fill="#000000" opacity=".35"/>
    <g class="idle">
      <rect x="140" y="96" width="24" height="24" rx="6" fill="#FF9AA2" stroke="#F2667A" stroke-width="2"/>
      <rect x="154" y="103" width="4" height="7" rx="1" fill="#3D4B3F"/>
      <rect x="144" y="112" width="5" height="3" rx="1.5" fill="#FFFFFF" opacity=".7"/>
    </g>

    <!-- 골인 깃발 -->
    <rect x="806" y="64" width="3" height="56" fill="#8FA394"/>
    <circle cx="807.5" cy="62" r="4" fill="#FFE08A" stroke="#E0B84A" stroke-width="1.5"/>
    <path class="wave" d="M809 68 h30 l-8 9 8 9 h-30 z" fill="#A8E6A3" stroke="#74C27A" stroke-width="2" stroke-linejoin="round"/>
    <rect x="796" y="114" width="23" height="6" rx="2" fill="#A8E6A3" stroke="#74C27A" stroke-width="2"/>
  </g>
</svg>
